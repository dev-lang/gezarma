<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Etiqueta {{ t.numero_rma }}</title>
<style>
  /* Etiqueta 62 x 29 mm (Brother QL y similares). El código de barras va en su
     tamaño exacto: no escalar al imprimir ("tamaño real" / 100 %). */
  @page { size: 62mm 29mm; margin: 1.2mm 1.5mm; }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 6.3pt; color: #000; margin: 0; }
  table { width: 100%; }
  td { vertical-align: top; padding: 0; }
  .rma { font-family: Courier, monospace; font-size: 8.3pt; font-weight: bold; }
  @media screen { body { width: 59mm; margin: 12px; } }
</style>
</head>
<body>
<table>
  <tr>
    <td style="width: 19mm;"><img src="{{ qr_taller }}" width="18mm" height="18mm"></td>
    <td>
      <div class="rma">{{ t.numero_rma }}</div>
      <div><b>{{ (t.producto or "")[:30] }}</b></div>
      <div>SN {{ (t.numero_serie or "")[:28] }}</div>
      <div>{{ (cliente.nombre or "")[:30] }}</div>
      <div>Ingreso {{ fecha_ingreso[:10] }}</div>
    </td>
  </tr>
</table>
<div style="text-align: center;"><img src="{{ barcode_rma.src }}" width="{{ barcode_rma.ancho_mm }}mm" height="{{ barcode_rma.alto_mm }}mm"></div>
{% if imprimir %}<script>window.addEventListener('load', function () { setTimeout(function () { window.print(); }, 300); });</script>{% endif %}
</body>
</html>
