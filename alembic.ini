# Configuración de Alembic (migraciones de base de datos).
# La URL de la base NO se define acá: se toma de DATABASE_URL (ver .env.example).
#
# Uso habitual (desde la raíz del repo):
#   alembic upgrade head                              aplicar migraciones (la app lo hace sola al arrancar)
#   alembic revision --autogenerate -m "descripcion"  generar una migración tras cambiar models.py
#   alembic current / alembic history                 ver en qué versión está la base

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
