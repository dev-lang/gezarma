        /* Íconos SVG (js/ui/iconos.js): alineados con el texto y del color del texto */
        /* (más específico que el "svg { display: block }" de Tailwind, pero sin pisar a .hidden) */
        .ico:not(.hidden) { display: inline-block; }
        .ico { flex-shrink: 0; vertical-align: -0.125em; }
        body { font-family: 'Inter', sans-serif; }
        /* Respaldo por si no carga Tailwind; :where() no le gana a md:flex & co. */
        :where(.hidden) { display: none; }

        /* Toast */
        @keyframes slideIn  { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0);    opacity: 1; } to { transform: translateX(110%); opacity: 0; } }
        .toast-enter { animation: slideIn  0.3s ease forwards; }
        .toast-leave { animation: slideOut 0.3s ease forwards; }
        /* Botón mientras se guarda (ver api.js) */
        @keyframes girar { to { transform: rotate(360deg); } }
        button.guardando { cursor: wait; opacity: .75; }
        button.guardando::after { content: ''; display: inline-block; width: .85em; height: .85em; margin-left: .45em;
            border: 2px solid currentColor; border-right-color: transparent; border-radius: 9999px;
            animation: girar .6s linear infinite; vertical-align: -.12em; }

        /* Skeleton */
        @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .skeleton { animation: shimmer 1.4s ease-in-out infinite; background: #e5e7eb; border-radius: 4px; }
        .dark .skeleton { background: #374151; }

        /* ── Dark mode ── */
        .dark body                          { background: #0f172a; color: #e2e8f0; }
        .dark .bg-white                     { background: #1e293b !important; }
        .dark .bg-gray-50                   { background: #0f172a !important; }
        .dark .bg-gray-50\/50               { background: #1e293b !important; }
        .dark .bg-gray-100                  { background: #334155 !important; }
        .dark .bg-gray-800                  { background: #0f172a !important; }
        .dark .text-gray-800, .dark .text-gray-900 { color: #e2e8f0 !important; }
        .dark .text-gray-700                { color: #cbd5e1 !important; }

        .dark .text-gray-500                { color: #9aa8bb !important; }
        .dark .text-gray-400                { color: #8494a9 !important; }
        .dark .text-gray-300                { color: #7d8ca2 !important; }

            background: #0f172a !important;
            color: #e2e8f0 !important;
            border-color: #334155 !important;

        .dark input::placeholder, .dark textarea::placeholder { color: #7d8ca2 !important; }

        .dark .hover\:bg-gray-100:hover     { background: #334155 !important; }
        .dark nav                           { background: #0c1628 !important; }
        /* tonos claros de color en modo oscuro (insignias, avisos, tarjetas) */

        .dark .text-green-700, .dark .text-green-800, .dark .text-green-900 { color: #86efac !important; }
        .dark .text-emerald-700, .dark .text-emerald-800, .dark .text-emerald-900 { color: #6ee7b7 !important; }
        .dark .text-amber-700, .dark .text-amber-800, .dark .text-amber-900 { color: #fcd34d !important; }
        .dark .text-yellow-700, .dark .text-yellow-800, .dark .text-yellow-900 { color: #fde047 !important; }
        /* Sobre un fondo amarillo/ámbar fuerte (botón Favoritos) el texto sigue oscuro */
        .dark :is(.bg-yellow-300, .bg-yellow-400, .bg-yellow-500, .bg-amber-400, .bg-amber-500):is(.text-yellow-900, .text-yellow-800, .text-amber-900) { color: #422006 !important; }
        .dark .text-orange-700, .dark .text-orange-800, .dark .text-orange-900 { color: #fdba74 !important; }
        .dark .text-red-700, .dark .text-red-800, .dark .text-red-900 { color: #fca5a5 !important; }

        .dark .text-violet-700, .dark .text-violet-800, .dark .text-violet-900 { color: #c4b5fd !important; }
        .dark .text-purple-700, .dark .text-purple-800, .dark .text-purple-900 { color: #d8b4fe !important; }
        .dark .text-teal-700, .dark .text-teal-800, .dark .text-teal-900 { color: #5eead4 !important; }
        .dark .text-cyan-700, .dark .text-cyan-800, .dark .text-cyan-900 { color: #67e8f9 !important; }
        .dark .text-sky-700, .dark .text-sky-800, .dark .text-sky-900 { color: #7dd3fc !important; }
        .dark .bg-blue-50     { background: #1e3a5f !important; }
        .dark .bg-blue-100, .dark .bg-blue-200 { background: #1e40af55 !important; }
        .dark .border-blue-100, .dark .border-blue-200 { border-color: #1e3a8a !important; }
        .dark .bg-green-50    { background: #14281e !important; }
        .dark .bg-green-100, .dark .bg-green-200 { background: #14532d !important; }
        .dark .border-green-100, .dark .border-green-200 { border-color: #166534 !important; }
        .dark .bg-emerald-50  { background: #0f2a22 !important; }
        .dark .bg-emerald-100, .dark .bg-emerald-200 { background: #064e3b !important; }
        .dark .border-emerald-100, .dark .border-emerald-200 { border-color: #065f46 !important; }
        .dark .bg-amber-50    { background: #2d1f07 !important; }

        .dark .bg-yellow-50   { background: #2a2507 !important; }

        .dark .border-yellow-100, .dark .border-yellow-200 { border-color: #854d0e !important; }
        .dark .bg-orange-50   { background: #2d1607 !important; }
        .dark .bg-orange-100, .dark .bg-orange-200 { background: #7c2d1266 !important; }
        .dark .border-orange-100, .dark .border-orange-200 { border-color: #9a3412 !important; }
        .dark .bg-red-50      { background: #2d0f0f !important; }
        .dark .bg-red-100, .dark .bg-red-200 { background: #7f1d1d66 !important; }
        .dark .border-red-100, .dark .border-red-200 { border-color: #991b1b !important; }
        .dark .bg-rose-50     { background: #2d0f18 !important; }

        @media print {
            body { background: white !important; font-size: 11pt; color: black !important; }
            * { color: black !important; background: white !important; border-color: #ccc !important; }
            #navbar, #search-container, #action-buttons, #mgmt-card,
            #upload-btn, #back-to-list, #advanced-stats, #stats-container { display: none !important; }
            .shadow  { box-shadow: none !important; border: 1px solid #ddd; }
            .container { max-width: 100% !important; margin: 0 !important; }
        }
        @media (max-width: 639px) {
            .container { padding-left: 1rem; padding-right: 1rem; }
            nav .container { flex-wrap: wrap; }
            /* La búsqueda se abre con la lupa y ocupa toda la fila de abajo */
            #search-container:not(.abierto) { display: none !important; }
            #search-container.abierto { order: 3; flex-basis: 100%; width: 100%; margin: 4px 0 6px; max-width: none; }
            /* Administración: los encabezados de cada sección (título + buscador + botones) bajan de renglón */
            .admin-tab-content .justify-between { flex-wrap: wrap; row-gap: .75rem; }
            .admin-tab-content .justify-between > * { min-width: 0; }
            .admin-tab-content .justify-between > .flex { flex-wrap: wrap; }
            .admin-tab-content .justify-between select { flex: 1 1 9rem; min-width: 0; }
            .admin-tab-content .justify-between input[type=text],
            .admin-tab-content .justify-between input[type=search] { flex: 1 1 9rem; width: auto; min-width: 0; }
            .admin-tab-content .p-5, .admin-tab-content .p-6 { padding-left: 1rem; padding-right: 1rem; }
            /* Tarjetas grandes: menos relleno, más lugar para el contenido */
            #detail-section .p-8, #mostrador-section .p-8, #dashboard-section .p-6 { padding: 1.1rem; }
        }
        /* Táctil o pantalla chica: los botones de solo texto (Editar, Eliminar, Ver…) tienen poca altura; más zona para tocar */
        @media (pointer: coarse), (max-width: 639px) {
            button:not([class*=" py-"]):not([class^="py-"]):not([class*=" p-"]):not([class^="p-"]):not([class*=" h-"]):not([class^="h-"]):not([class*=" w-"]):not([class^="w-"]) {
                padding-top: .45rem; padding-bottom: .45rem;
            }
            button.py-0\.5, button.py-1 { padding-top: .35rem; padding-bottom: .35rem; }
            button[id^="close"], button[aria-label="Cerrar"], button[data-cerrar] { min-width: 2.25rem; min-height: 2.25rem; }
        }
        /* Las tablas del panel nunca ensanchan la página: se desplazan dentro de su tarjeta */
        .admin-tab-content table { min-width: 36rem; }
        .admin-tab-content :has(> table) { overflow-x: auto; }
        @media (max-width: 1023px) {
            /* La columna de acciones (Editar, Eliminar, Ver) queda siempre a la vista al desplazar la tabla */
            .admin-tab-content table tr > :last-child, #parts-section table tr > :last-child {
                position: sticky; right: 0; background: #fff; box-shadow: -8px 0 8px -8px rgba(15, 23, 42, .25);
            }
            .admin-tab-content thead tr > :last-child { background: #f9fafb; }
            .dark .admin-tab-content table tr > :last-child,
            .dark #parts-section table tr > :last-child { background: #1e293b; }
            /* El menú de Administración se desplaza de costado: el borde se desvanece para que se note */
            #admin-menu nav { -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); scrollbar-width: none; }
            #admin-menu nav::-webkit-scrollbar { display: none; }
        }
        /* Lista de tickets: fila entera clickeable; vista compacta; en el celular, cada ticket es una tarjeta */
        #ticket-list-body tr[data-ticket-id] { cursor: pointer; }
        #ticket-list-body tr[data-ticket-id]:focus-visible { outline: 2px solid #3b82f6; outline-offset: -2px; }
        #ticket-tabla.compacta td { padding-top: .45rem; padding-bottom: .45rem; }
        #ticket-tabla.compacta td .t-sub { display: none; }
        @media (max-width: 639px) {
            #ticket-filters { flex-wrap: nowrap; }
            #ticket-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
            #ticket-chips > * { flex-shrink: 0; }
            #ticket-densidad span { display: none; }
            #ticket-tabla { min-width: 0; }
            #ticket-tabla thead { display: none; }
            #ticket-tabla tr[data-ticket-id] { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "ticket estado" "equipo equipo" "cliente dias"; gap: .2rem .75rem; padding: .8rem 1rem; }
            #ticket-tabla tr[data-ticket-id] td { padding: 0 !important; border: 0; }
            #ticket-tabla td[data-col=ticket] { grid-area: ticket; } #ticket-tabla td[data-col=estado] { grid-area: estado; }
            #ticket-tabla td[data-col=equipo] { grid-area: equipo; } #ticket-tabla td[data-col=cliente] { grid-area: cliente; color: #6b7280; font-size: .8rem; }
            #ticket-tabla td[data-col=dias], #ticket-tabla td[data-col=fecha] { grid-area: dias; text-align: right; font-size: .8rem; }
            #ticket-tabla td[data-col=tecnico], #ticket-tabla td[data-col=prioridad] { display: none; }
            #ticket-tabla td[data-col=dias] .t-dias::after { content: " d"; }
        }
    </style>
</head>
