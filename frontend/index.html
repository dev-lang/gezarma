<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEZARMA - Gestión de RMA</title>
    <link rel="stylesheet" href="/css/oscuro.css">
    <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Ajustes: campo que coincide con la búsqueda (js/ajustes.js) */
        .aj-coincide { background: #fef9c3; border-radius: .5rem; box-shadow: 0 0 0 6px #fef9c3; }
        .dark .aj-coincide { background: #3f3a12; box-shadow: 0 0 0 6px #3f3a12; }
        /* Panel de control personalizable (js/panel.js) */
        #panel-bloques:not(.panel-editando) > .panel-oculto, #panel-bloques > [data-sin-permiso] { display: none !important; }
        .panel-editando > [data-bloque] { position: relative; padding-top: 3.25rem !important; outline: 2px dashed #bfdbfe; outline-offset: 4px; border-radius: .75rem; }
        .panel-editando > [data-bloque].hidden:not([data-sin-permiso]) { display: block !important; min-height: 3.5rem; opacity: .7; }
        .panel-editando > .panel-oculto { opacity: .4; }
        .panel-editando > [data-bloque]:not(.hidden) [data-vacio] { display: none; }
        .panel-barra { position: absolute; top: .5rem; left: .5rem; right: .5rem; z-index: 5; display: flex; align-items: center; gap: .375rem;
                       background: #eff6ff; border: 1px solid #bfdbfe; border-radius: .5rem; padding: .25rem .5rem; font-size: .8125rem; color: #1e3a8a; }
        /* En un cuarto de ancho, la barrita va en dos renglones: título arriba y controles abajo */
        .panel-editando > [data-ancho="cuarto"] { padding-top: 5.25rem !important; }
        .panel-editando > [data-ancho="cuarto"] > .panel-barra { flex-wrap: wrap; row-gap: .25rem; }
        .panel-editando > [data-ancho="cuarto"] > .panel-barra > .panel-titulo { flex-basis: calc(100% - 2rem); }
        .panel-editando > [data-ancho="cuarto"] > .panel-barra > [data-ancho] { margin-right: auto; }
        .panel-manija { cursor: grab; color: #60a5fa; padding: .125rem; }
        .panel-btn { width: 1.75rem; height: 1.75rem; display: inline-flex; align-items: center; justify-content: center; border-radius: .375rem; color: #3b82f6; }
        .panel-btn:hover { background: #dbeafe; }
        .panel-arrastrando { opacity: .35; }
        body.panel-con-pie { padding-bottom: 5rem; }
        .dark .panel-barra { background: #1e3a5f; border-color: #1e40af; color: #bfdbfe; }
        .dark .panel-barra :is(.text-gray-400, .text-gray-500) { color: #a9bdd6 !important; }
        .dark .panel-editando > [data-bloque] { outline-color: #1e40af; }
        .dark .panel-btn:hover { background: #1e40af; }
        /* Íconos SVG (js/ui/iconos.js): alineados con el texto y del color del texto */
        /* (más específico que el "svg { display: block }" de Tailwind, pero sin pisar a .hidden) */
        .ico:not(.hidden) { display: inline-block; }
        .ico { flex-shrink: 0; vertical-align: -0.125em; }
        body { font-family: 'Inter', sans-serif; }
        /* Respaldo por si no carga Tailwind; :where() no le gana a md:flex & co. */
        :where(.hidden) { display: none; }

        /* Toast */
        @keyframes slideIn  { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0);    opacity: 1; } to { transform: translateX(110%); opacity: 0; } }
        .toast-enter { animation: slideIn  0.3s ease forwards; }
        .toast-leave { animation: slideOut 0.3s ease forwards; }
        /* Botón mientras se guarda (ver api.js) */
        @keyframes girar { to { transform: rotate(360deg); } }
        button.guardando { cursor: wait; opacity: .75; }
        button.guardando::after { content: ''; display: inline-block; width: .85em; height: .85em; margin-left: .45em;
            border: 2px solid currentColor; border-right-color: transparent; border-radius: 9999px;
            animation: girar .6s linear infinite; vertical-align: -.12em; }

        /* Skeleton */
        @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .skeleton { animation: shimmer 1.4s ease-in-out infinite; background: #e5e7eb; border-radius: 4px; }
        .dark .skeleton { background: #374151; }

        /* Modo oscuro: los colores están en css/oscuro.css (lo genera herramientas/modo_oscuro.py) */

        @media print {
            body { background: white !important; font-size: 11pt; color: black !important; }
            * { color: black !important; background: white !important; border-color: #ccc !important; }
            #navbar, #search-container, #action-buttons, #mgmt-card,
            #upload-btn, #back-to-list, #advanced-stats, #stats-container { display: none !important; }
            .shadow  { box-shadow: none !important; border: 1px solid #ddd; }
            .container { max-width: 100% !important; margin: 0 !important; }
        }
        @media (max-width: 639px) {
            .container { padding-left: 1rem; padding-right: 1rem; }
            nav .container { flex-wrap: wrap; }
            /* La búsqueda se abre con la lupa y ocupa toda la fila de abajo */
            #search-container:not(.abierto) { display: none !important; }
            #search-container.abierto { order: 3; flex-basis: 100%; width: 100%; margin: 4px 0 6px; max-width: none; }
            /* Administración: los encabezados de cada sección (título + buscador + botones) bajan de renglón */
            .admin-tab-content .justify-between { flex-wrap: wrap; row-gap: .75rem; }
            .admin-tab-content .justify-between > * { min-width: 0; }
            .admin-tab-content .justify-between > .flex { flex-wrap: wrap; }
            .admin-tab-content .justify-between select { flex: 1 1 9rem; min-width: 0; }
            .admin-tab-content .justify-between input[type=text],
            .admin-tab-content .justify-between input[type=search] { flex: 1 1 9rem; width: auto; min-width: 0; }
            .admin-tab-content .p-5, .admin-tab-content .p-6 { padding-left: 1rem; padding-right: 1rem; }
            /* Tarjetas grandes: menos relleno, más lugar para el contenido */
            #detail-section .p-8, #mostrador-section .p-8, #dashboard-section .p-6 { padding: 1.1rem; }
        }
        /* Táctil o pantalla chica: los botones de solo texto (Editar, Eliminar, Ver…) tienen poca altura; más zona para tocar */
        @media (pointer: coarse), (max-width: 639px) {
            button:not([class*=" py-"]):not([class^="py-"]):not([class*=" p-"]):not([class^="p-"]):not([class*=" h-"]):not([class^="h-"]):not([class*=" w-"]):not([class^="w-"]) {
                padding-top: .45rem; padding-bottom: .45rem;
            }
            button.py-0\.5, button.py-1 { padding-top: .35rem; padding-bottom: .35rem; }
            button[id^="close"], button[aria-label="Cerrar"], button[data-cerrar] { min-width: 2.25rem; min-height: 2.25rem; }
        }
        /* Las tablas del panel nunca ensanchan la página: se desplazan dentro de su tarjeta */
        .admin-tab-content table { min-width: 36rem; }
        .admin-tab-content :has(> table) { overflow-x: auto; }
        @media (max-width: 1023px) {
            /* La columna de acciones (Editar, Eliminar, Ver) queda siempre a la vista al desplazar la tabla */
            .admin-tab-content table tr > :last-child, #parts-section table tr > :last-child {
                position: sticky; right: 0; background: #fff; box-shadow: -8px 0 8px -8px rgba(15, 23, 42, .25);
            }
            .admin-tab-content thead tr > :last-child { background: #f9fafb; }
            .dark .admin-tab-content table tr > :last-child,
            .dark #parts-section table tr > :last-child { background: #1e293b; }
            /* El menú de Administración se desplaza de costado: el borde se desvanece para que se note */
            #admin-menu nav { -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); scrollbar-width: none; }
            #admin-menu nav::-webkit-scrollbar { display: none; }
        }
        /* Lista de tickets: fila entera clickeable; vista compacta; en el celular, cada ticket es una tarjeta */
        #ticket-list-body tr[data-ticket-id] { cursor: pointer; }
        #ticket-list-body tr[data-ticket-id]:focus-visible { outline: 2px solid #3b82f6; outline-offset: -2px; }
        #ticket-tabla.compacta td { padding-top: .45rem; padding-bottom: .45rem; }
        #ticket-tabla.compacta td .t-sub { display: none; }
        @media (max-width: 639px) {
            #ticket-filters { flex-wrap: nowrap; }
            #ticket-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
            #ticket-chips > * { flex-shrink: 0; }
            #ticket-densidad span { display: none; }
            #ticket-tabla { min-width: 0; }
            #ticket-tabla thead { display: none; }
            #ticket-tabla tr[data-ticket-id] { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "ticket estado" "equipo equipo" "cliente dias"; gap: .2rem .75rem; padding: .8rem 1rem; }
            #ticket-tabla tr[data-ticket-id] td { padding: 0 !important; border: 0; }
            #ticket-tabla td[data-col=ticket] { grid-area: ticket; } #ticket-tabla td[data-col=estado] { grid-area: estado; }
            #ticket-tabla td[data-col=equipo] { grid-area: equipo; } #ticket-tabla td[data-col=cliente] { grid-area: cliente; color: #6b7280; font-size: .8rem; }
            #ticket-tabla td[data-col=dias], #ticket-tabla td[data-col=fecha] { grid-area: dias; text-align: right; font-size: .8rem; }
            #ticket-tabla td[data-col=tecnico], #ticket-tabla td[data-col=prioridad] { display: none; }
            #ticket-tabla td[data-col=dias] .t-dias::after { content: " d"; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen transition-colors duration-200">

    <!-- Navigation Bar -->
    <nav id="navbar" class="bg-blue-800 text-white shadow-md hidden">
        <div class="container mx-auto px-6 py-3 flex items-center gap-3">
            <h1 class="text-lg font-bold tracking-tight min-w-0">
                <a href="/" id="logo-home" title="Ir al panel de control"
                    class="flex items-center gap-2.5 rounded-lg px-1 -mx-1 select-none hover:text-blue-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-300">
                    <span id="marca-logo" class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center overflow-hidden shrink-0"><i data-icono="llave" class="w-4 h-4"></i></span>
                    <span id="marca-nombre" translate="no" class="truncate max-w-[10rem] sm:max-w-[16rem]">GEZARMA</span>
                </a>
            </h1>
            <div id="search-container" class="hidden flex-1 max-w-md mx-4 lg:mx-8">
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-300 pointer-events-none"><i data-icono="buscar" class="w-4 h-4"></i></span>
                    <input type="text" id="global-search"
                        class="w-full bg-blue-900 text-blue-100 pl-9 pr-4 md:pr-24 py-2 rounded-lg border border-blue-700 outline-none focus:ring-2 focus:ring-blue-400 text-sm"
                        placeholder="Buscar por serie, RMA o producto…" title="Enter para ver todos los resultados" aria-label="Buscar">
                    <!-- "Ir a…" (js/navegacion.js): también con Ctrl + K -->
                    <button type="button" id="ir-btn" title="Ir a una pantalla o sección"
                        class="hidden md:flex absolute right-1.5 top-1/2 -translate-y-1/2 items-center gap-1.5 text-[11px] font-semibold text-blue-200 hover:text-white bg-blue-800/70 hover:bg-blue-700 rounded-md px-2 py-1 transition">
                        <span class="font-sans">Ir a…</span><kbd id="ir-btn-tecla" translate="no" class="font-mono font-normal opacity-80">Ctrl K</kbd>
                    </button>
                    <div id="search-results"
                        class="absolute top-full left-0 right-0 bg-white shadow-2xl rounded-b-lg border mt-1 text-gray-800 z-50 hidden max-h-96 overflow-y-auto">
                    </div>
                </div>
            </div>
            <div class="ml-auto flex items-center gap-1.5 md:gap-2">
                <!-- Celular: la búsqueda se abre con la lupa -->
                <button type="button" id="search-toggle" class="sm:hidden w-9 h-9 rounded-lg flex items-center justify-center text-blue-200 hover:bg-blue-700 transition"
                    aria-label="Buscar" aria-controls="search-container" aria-expanded="false">
                    <i data-icono="buscar" class="w-5 h-5"></i>
                </button>

                <!-- Ancla del cronómetro en curso (js/tiempo.js) -->
                <span id="user-info" class="hidden"></span>

                <!-- Usuario: idioma, horas, modo oscuro, atajos y salir en un menú (la campana se agrega antes) -->
                <div class="relative" id="user-menu-wrap">
                    <button type="button" id="user-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="user-menu" aria-label="Menú de usuario"
                        class="flex items-center gap-2 rounded-full md:rounded-lg p-0.5 md:pl-1 md:pr-2 md:py-1 hover:bg-blue-700 transition">
                        <span class="w-8 h-8 rounded-full bg-blue-600 ring-2 ring-blue-500/60 flex items-center justify-center text-xs font-bold shrink-0">
                            <span id="user-iniciales" translate="no">·</span>
                        </span>
                        <span class="hidden md:block text-left leading-tight max-w-[11rem]">
                            <span id="user-nombre-barra" translate="no" class="block text-sm font-semibold truncate"></span>
                            <span id="user-rol-barra" class="block text-[11px] text-blue-200"></span>
                        </span>
                        <i data-icono="abajo" class="hidden md:block w-4 h-4 text-blue-200"></i>
                    </button>
                    <div id="user-menu" class="hidden absolute right-0 top-12 z-[95] w-64 bg-white text-gray-800 rounded-xl shadow-2xl border border-gray-100 overflow-hidden py-1">
                        <div class="px-4 py-3 border-b">
                            <p id="user-info-menu" class="text-sm font-semibold"></p>
                        </div>
                        <!-- Solo administradores (ui.initDashboard); resaltado suave para encontrarlo rápido -->
                        <div id="menu-admin-wrap" class="hidden px-2 py-2 border-b">
                            <button type="button" id="menu-admin" class="w-full text-left px-2.5 py-2 rounded-lg text-sm font-semibold bg-blue-50 text-blue-700 hover:bg-blue-100 aria-[current=page]:ring-1 aria-[current=page]:ring-blue-300 flex items-center gap-2.5 transition">
                                <i data-icono="engranaje" class="w-4 h-4"></i><span>Administración</span>
                                <kbd translate="no" class="hidden md:inline ml-auto text-[10px] font-mono font-semibold text-blue-400 tracking-wider">G A</kbd>
                            </button>
                            <!-- Las 3 secciones más usadas (js/navegacion.js) -->
                            <div id="menu-admin-recientes" class="hidden flex flex-wrap gap-1 px-1 pt-2"></div>
                        </div>
                        <button type="button" id="menu-ir" class="md:hidden w-full text-left px-4 py-2.5 text-sm hover:bg-gray-50 flex items-center gap-2.5 border-b"><i data-icono="buscar" class="w-4 h-4 text-gray-400"></i>Ir a una sección…</button>
                        <div class="px-4 py-2.5 border-b flex items-center justify-between gap-3">
                            <span class="text-sm text-gray-600 flex items-center gap-2.5"><i data-icono="idioma" class="w-4 h-4 text-gray-400"></i>Idioma</span>
                            <span data-idioma-selector="text-sm border border-gray-200 rounded-lg px-2 py-1 bg-white"></span>
                        </div>
                        <button type="button" id="menu-horas" class="hidden w-full text-left px-4 py-2.5 text-sm hover:bg-gray-50 items-center gap-2.5"><i data-icono="reloj" class="w-4 h-4 text-gray-400"></i>Mis horas</button>
                        <button type="button" id="menu-dark" class="w-full text-left px-4 py-2.5 text-sm hover:bg-gray-50 flex items-center gap-2.5">
                            <span id="icon-moon" class="text-gray-400"><i data-icono="luna" class="w-4 h-4"></i></span>
                            <span id="icon-sun" class="hidden text-gray-400"><i data-icono="sol" class="w-4 h-4"></i></span>
                            <span id="menu-dark-txt">Modo oscuro</span>
                        </button>
                        <button type="button" id="menu-atajos" class="hidden md:flex w-full text-left px-4 py-2.5 text-sm hover:bg-gray-50 items-center gap-2.5"><i data-icono="teclado" class="w-4 h-4 text-gray-400"></i>Atajos de teclado</button>
                        <div class="border-t my-1"></div>
                        <button type="button" id="menu-logout" class="w-full text-left px-4 py-2.5 text-sm font-semibold text-red-600 hover:bg-red-50 flex items-center gap-2.5"><i data-icono="salir" class="w-4 h-4"></i>Cerrar Sesión</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ── Notification Bell Dropdown ────────────────────────────────────── -->
    <!-- Bell button is injected just before logout via JS (notif.js) -->
    <div id="notif-dropdown"
        class="fixed top-14 right-4 z-[90] w-96 max-w-[95vw] bg-white rounded-2xl shadow-2xl border border-gray-100 hidden flex-col"
        style="max-height: 480px;">
        <div class="flex items-center justify-between px-4 py-3 border-b">
            <span class="text-sm font-bold text-gray-800">Notificaciones</span>
            <div class="flex gap-2">
                <button type="button" id="notif-mark-all-btn"
                    class="text-xs text-blue-500 hover:text-blue-700 font-semibold">Marcar todas leídas</button>
                <button type="button" id="notif-show-all-toggle"
                    class="text-xs text-gray-400 hover:text-gray-600 font-semibold">Ver todas</button>
            </div>
        </div>
        <div id="notif-list" class="overflow-y-auto flex-1 divide-y divide-gray-50"></div>
    </div>

    <!-- Toast container -->
    <!-- En el celular los avisos van abajo (no tapan la barra ni lo que se está tocando) -->
    <div id="toast-container" class="fixed bottom-4 left-4 right-4 sm:bottom-auto sm:left-auto sm:top-5 sm:right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Main content -->
    <main class="container mx-auto px-6 py-8" id="app-root"></main>

    <!-- Scripts -->
    <script>
        // Ningún formulario de la app se envía "a la antigua" (recargando la página):
        // todos los maneja JavaScript. Si un script no llegó a conectarse, mejor que
        // el botón no haga nada a que recargue y parezca que guardó.
        document.addEventListener('submit', e => e.preventDefault(), true);
    </script>
    <script src="js/ui/escape.js"></script>
    <script src="js/ui/iconos.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/confirm.js"></script>
    <script src="js/ui/modales.js"></script>
    <script src="js/ui/skeleton.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ajustes.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/documentos.js"></script>
    <script src="js/recepcion.js"></script>
    <script src="js/encuesta.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/tiempo.js"></script>
    <script src="js/horas.js"></script>
    <script src="js/ubicaciones.js"></script>
    <script src="js/envios.js"></script>
    <script src="js/pedidos.js"></script>
    <script src="js/kanban.js"></script>
    <script src="js/adjuntos.js"></script>
    <script src="js/busqueda.js"></script>
    <script src="js/barra.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/atajos.js"></script>
    <script src="js/guia.js"></script>
    <script src="js/setup.js"></script>
    <script src="js/importar.js"></script>
    <script src="js/gestion.js"></script>
    <script src="js/app.js"></script>
    <script type="module">
        import * as Budget from './js/budget.js';
        import * as Notif  from './js/notifications.js';
        window.Budget = Budget;
        window.Notif  = Notif;
    </script>

    <script>
        // Dark mode — persists via localStorage, applies before render
        (function() {
            // 'gezatek-dark' es la clave anterior al cambio de nombre: se sigue leyendo
            const pref = localStorage.getItem('gezarma-dark') ?? localStorage.getItem('gezatek-dark');
            if (pref === '1') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</body>
</html>
