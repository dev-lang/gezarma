<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEZARMA - Gestión de RMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none; }

        /* Toast */
        @keyframes slideIn  { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0);    opacity: 1; } to { transform: translateX(110%); opacity: 0; } }
        .toast-enter { animation: slideIn  0.3s ease forwards; }
        .toast-leave { animation: slideOut 0.3s ease forwards; }

        /* Skeleton */
        @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .skeleton { animation: shimmer 1.4s ease-in-out infinite; background: #e5e7eb; border-radius: 4px; }
        .dark .skeleton { background: #374151; }

        /* ── Dark mode ── */
        .dark body                          { background: #0f172a; color: #e2e8f0; }
        .dark .bg-white                     { background: #1e293b !important; }
        .dark .bg-gray-50                   { background: #0f172a !important; }
        .dark .bg-gray-50\/50               { background: #1e293b !important; }
        .dark .bg-gray-100                  { background: #334155 !important; }
        .dark .bg-gray-800                  { background: #0f172a !important; }
        .dark .text-gray-800, .dark .text-gray-900 { color: #e2e8f0 !important; }
        .dark .text-gray-700                { color: #cbd5e1 !important; }
        .dark .text-gray-600                { color: #94a3b8 !important; }
        .dark .text-gray-500                { color: #64748b !important; }
        .dark .text-gray-400                { color: #475569 !important; }
        .dark .border-gray-100              { border-color: #1e293b !important; }
        .dark .border-gray-200              { border-color: #334155 !important; }
        .dark .border                       { border-color: #334155 !important; }
        .dark .border-b                     { border-color: #334155 !important; }
        .dark .border-t                     { border-color: #334155 !important; }
        .dark .divide-y > *                 { border-color: #334155 !important; }
        .dark .divide-gray-50 > *           { border-color: #1e293b !important; }
        .dark .shadow                       { box-shadow: 0 1px 3px rgba(0,0,0,.5) !important; }
        .dark .shadow-lg                    { box-shadow: 0 4px 20px rgba(0,0,0,.6) !important; }
        .dark input, .dark textarea, .dark select {
            background: #0f172a !important;
            color: #e2e8f0 !important;
            border-color: #334155 !important;
        }
        .dark input::placeholder, .dark textarea::placeholder { color: #475569 !important; }
        .dark .hover\:bg-gray-50:hover      { background: #1e293b !important; }
        .dark .hover\:bg-gray-100:hover     { background: #334155 !important; }
        .dark nav                           { background: #0c1628 !important; }
        /* tonos claros de color en modo oscuro (insignias, avisos, tarjetas) */
        .dark .text-blue-700, .dark .text-blue-800, .dark .text-blue-900 { color: #93c5fd !important; }
        .dark .text-green-700, .dark .text-green-800, .dark .text-green-900 { color: #86efac !important; }
        .dark .text-emerald-700, .dark .text-emerald-800, .dark .text-emerald-900 { color: #6ee7b7 !important; }
        .dark .text-amber-700, .dark .text-amber-800, .dark .text-amber-900 { color: #fcd34d !important; }
        .dark .text-yellow-700, .dark .text-yellow-800, .dark .text-yellow-900 { color: #fde047 !important; }
        .dark .text-orange-700, .dark .text-orange-800, .dark .text-orange-900 { color: #fdba74 !important; }
        .dark .text-red-700, .dark .text-red-800, .dark .text-red-900 { color: #fca5a5 !important; }
        .dark .text-rose-700, .dark .text-rose-800, .dark .text-rose-900 { color: #fda4af !important; }
        .dark .text-indigo-700, .dark .text-indigo-800, .dark .text-indigo-900 { color: #a5b4fc !important; }
        .dark .text-violet-700, .dark .text-violet-800, .dark .text-violet-900 { color: #c4b5fd !important; }
        .dark .text-purple-700, .dark .text-purple-800, .dark .text-purple-900 { color: #d8b4fe !important; }
        .dark .text-teal-700, .dark .text-teal-800, .dark .text-teal-900 { color: #5eead4 !important; }
        .dark .text-cyan-700, .dark .text-cyan-800, .dark .text-cyan-900 { color: #67e8f9 !important; }
        .dark .text-sky-700, .dark .text-sky-800, .dark .text-sky-900 { color: #7dd3fc !important; }
        .dark .bg-blue-50     { background: #1e3a5f !important; }
        .dark .bg-blue-100, .dark .bg-blue-200 { background: #1e40af55 !important; }
        .dark .border-blue-100, .dark .border-blue-200 { border-color: #1e3a8a !important; }
        .dark .bg-green-50    { background: #14281e !important; }
        .dark .bg-green-100, .dark .bg-green-200 { background: #14532d !important; }
        .dark .border-green-100, .dark .border-green-200 { border-color: #166534 !important; }
        .dark .bg-emerald-50  { background: #0f2a22 !important; }
        .dark .bg-emerald-100, .dark .bg-emerald-200 { background: #064e3b !important; }
        .dark .border-emerald-100, .dark .border-emerald-200 { border-color: #065f46 !important; }
        .dark .bg-amber-50    { background: #2d1f07 !important; }
        .dark .bg-amber-100, .dark .bg-amber-200 { background: #78350f66 !important; }
        .dark .border-amber-100, .dark .border-amber-200 { border-color: #92400e !important; }
        .dark .bg-yellow-50   { background: #2a2507 !important; }
        .dark .bg-yellow-100, .dark .bg-yellow-200 { background: #713f1266 !important; }
        .dark .border-yellow-100, .dark .border-yellow-200 { border-color: #854d0e !important; }
        .dark .bg-orange-50   { background: #2d1607 !important; }
        .dark .bg-orange-100, .dark .bg-orange-200 { background: #7c2d1266 !important; }
        .dark .border-orange-100, .dark .border-orange-200 { border-color: #9a3412 !important; }
        .dark .bg-red-50      { background: #2d0f0f !important; }
        .dark .bg-red-100, .dark .bg-red-200 { background: #7f1d1d66 !important; }
        .dark .border-red-100, .dark .border-red-200 { border-color: #991b1b !important; }
        .dark .bg-rose-50     { background: #2d0f18 !important; }
        .dark .bg-rose-100, .dark .bg-rose-200 { background: #88133766 !important; }
        .dark .border-rose-100, .dark .border-rose-200 { border-color: #9f1239 !important; }
        .dark .bg-indigo-50   { background: #1a1a3e !important; }
        .dark .bg-indigo-100, .dark .bg-indigo-200 { background: #312e81 !important; }
        .dark .border-indigo-100, .dark .border-indigo-200 { border-color: #3730a3 !important; }
        .dark .bg-violet-50   { background: #1f1535 !important; }
        .dark .bg-violet-100, .dark .bg-violet-200 { background: #4c1d95 !important; }
        .dark .border-violet-100, .dark .border-violet-200 { border-color: #5b21b6 !important; }
        .dark .bg-purple-50   { background: #1e102e !important; }
        .dark .bg-purple-100, .dark .bg-purple-200 { background: #581c87 !important; }
        .dark .border-purple-100, .dark .border-purple-200 { border-color: #6b21a8 !important; }
        .dark .bg-teal-50     { background: #0f2828 !important; }
        .dark .bg-teal-100, .dark .bg-teal-200 { background: #134e4a !important; }
        .dark .border-teal-100, .dark .border-teal-200 { border-color: #115e59 !important; }
        .dark .bg-cyan-50     { background: #0c2730 !important; }
        .dark .bg-cyan-100, .dark .bg-cyan-200 { background: #164e63 !important; }
        .dark .border-cyan-100, .dark .border-cyan-200 { border-color: #155e75 !important; }
        .dark .bg-sky-50      { background: #0c2433 !important; }
        .dark .bg-sky-100, .dark .bg-sky-200 { background: #0c4a6e !important; }
        .dark .border-sky-100, .dark .border-sky-200 { border-color: #075985 !important; }

        @media print {
            body { background: white !important; font-size: 11pt; color: black !important; }
            * { color: black !important; background: white !important; border-color: #ccc !important; }
            #navbar, #search-container, #action-buttons, #mgmt-card,
            #upload-btn, #back-to-list, #advanced-stats, #stats-container { display: none !important; }
            .shadow  { box-shadow: none !important; border: 1px solid #ddd; }
            .container { max-width: 100% !important; margin: 0 !important; }
        }
        @media (max-width: 640px) {
            .container { padding-left: 1rem; padding-right: 1rem; }
            #search-container { order: 2; width: 100%; margin: 10px 0; max-width: none; }
            nav .container { flex-wrap: wrap; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen transition-colors duration-200">

    <!-- Navigation Bar -->
    <nav id="navbar" class="bg-blue-800 text-white shadow-md hidden">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">GEZARMA</h1>
            <div id="search-container" class="hidden flex-1 max-w-md mx-8">
                <div class="relative">
                    <input type="text" id="global-search"
                        class="w-full bg-blue-900 text-blue-100 px-4 py-2 rounded-lg border border-blue-700 outline-none focus:ring-2 focus:ring-blue-400 text-sm"
                        placeholder="Buscar por serie, RMA o producto... (Enter para ver todos)">
                    <div id="search-results"
                        class="absolute top-full left-0 right-0 bg-white shadow-2xl rounded-b-lg border mt-1 text-gray-800 z-50 hidden max-h-96 overflow-y-auto">
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-info" class="text-sm font-medium"></span>

                <!-- Dark mode toggle -->
                <button type="button" id="dark-toggle"
                    class="w-9 h-9 rounded-lg flex items-center justify-center text-blue-200 hover:bg-blue-700 transition"
                    title="Alternar modo oscuro" aria-label="Modo oscuro">
                    <!-- Sun icon (shown in dark mode) -->
                    <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
                    </svg>
                    <!-- Moon icon (shown in light mode) -->
                    <svg id="icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                </button>

                <button type="button" id="logout-btn" class="text-sm bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded transition">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- ── Notification Bell Dropdown ────────────────────────────────────── -->
    <!-- Bell button is injected just before logout via JS (notif.js) -->
    <div id="notif-dropdown"
        class="fixed top-14 right-4 z-[90] w-96 max-w-[95vw] bg-white rounded-2xl shadow-2xl border border-gray-100 hidden flex-col"
        style="max-height: 480px;">
        <div class="flex items-center justify-between px-4 py-3 border-b">
            <span class="text-sm font-bold text-gray-800">Notificaciones</span>
            <div class="flex gap-2">
                <button type="button" id="notif-mark-all-btn"
                    class="text-xs text-blue-500 hover:text-blue-700 font-semibold">Marcar todas leídas</button>
                <button type="button" id="notif-show-all-toggle"
                    class="text-xs text-gray-400 hover:text-gray-600 font-semibold">Ver todas</button>
            </div>
        </div>
        <div id="notif-list" class="overflow-y-auto flex-1 divide-y divide-gray-50"></div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Main content -->
    <main class="container mx-auto px-6 py-8" id="app-root"></main>

    <!-- Scripts -->
    <script src="js/ui/escape.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/confirm.js"></script>
    <script src="js/ui/modales.js"></script>
    <script src="js/ui/skeleton.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ajustes.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/documentos.js"></script>
    <script src="js/recepcion.js"></script>
    <script src="js/encuesta.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/tiempo.js"></script>
    <script src="js/pedidos.js"></script>
    <script src="js/kanban.js"></script>
    <script src="js/adjuntos.js"></script>
    <script src="js/busqueda.js"></script>
    <script src="js/app.js"></script>
    <script type="module">
        import * as Budget from './js/budget.js';
        import * as Notif  from './js/notifications.js';
        window.Budget = Budget;
        window.Notif  = Notif;
    </script>

    <script>
        // Dark mode — persists via localStorage, applies before render
        (function() {
            // 'gezatek-dark' es la clave anterior al cambio de nombre: se sigue leyendo
            const pref = localStorage.getItem('gezarma-dark') ?? localStorage.getItem('gezatek-dark');
            if (pref === '1') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</body>
</html>
