<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de reparación - GEZARMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <header class="bg-blue-800 text-white">
        <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
            <span id="marca" class="text-lg font-bold tracking-tight">GEZARMA</span>
            <a href="/" class="text-sm text-blue-200 hover:text-white">Ingresar</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-6 space-y-5">
        <section class="bg-white rounded-2xl shadow border border-gray-100 p-5">
            <h1 class="text-xl font-bold">Seguimiento de reparación</h1>
            <p class="text-sm text-gray-500 mt-1">Ingresá el N° de RMA y el N° de serie del equipo. Están en tu orden de ingreso.</p>
            <form id="form" class="mt-4 space-y-3">
                <div>
                    <label for="rma" class="block text-sm font-semibold mb-1">N° de RMA</label>
                    <input id="rma" name="rma" required autocomplete="off" placeholder="RMA-2026-CLAA001"
                        class="w-full px-3 py-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 uppercase font-mono">
                </div>
                <div>
                    <label for="serie" class="block text-sm font-semibold mb-1">N° de serie</label>
                    <input id="serie" name="serie" required autocomplete="off"
                        class="w-full px-3 py-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <button id="btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">Consultar</button>
            </form>
            <p id="error" class="hidden mt-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>
        </section>

        <section id="resultado" class="hidden bg-white rounded-2xl shadow border border-gray-100 overflow-hidden"></section>
    </main>

    <script>
    (function () {
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fecha = iso => iso ? new Date(iso).toLocaleString('es-AR', { hour12: false, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

        function mostrar(d) {
            const pasos = d.historial.map((h, i) => {
                const ultimo = i === d.historial.length - 1;
                return `
                <li class="relative pl-7 pb-4">
                    ${ultimo ? '' : '<span class="absolute left-[7px] top-4 bottom-0 w-0.5 bg-gray-200"></span>'}
                    <span class="absolute left-0 top-1 w-4 h-4 rounded-full border-2 border-white shadow" style="background:${esc(h.estado.color)}"></span>
                    <p class="text-sm ${ultimo ? 'font-bold' : 'text-gray-600'}">${esc(h.estado.etiqueta)}</p>
                    <p class="text-xs text-gray-400">${fecha(h.fecha)}</p>
                </li>`;
            }).join('');
            const envio = d.envio ? `
                <div class="px-5 py-4 border-t">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-1">Envío</p>
                    <p class="text-sm">${esc(d.envio.empresa || '')}${d.envio.tracking ? ` · tracking <span class="font-mono font-semibold">${esc(d.envio.tracking)}</span>` : ''}</p>
                    ${d.envio.fecha ? `<p class="text-xs text-gray-400">Despachado el ${fecha(d.envio.fecha)}</p>` : ''}
                </div>` : '';
            const pres = d.presupuesto_pendiente ? `
                <div class="px-5 py-4 border-t bg-amber-50">
                    <p class="text-sm font-semibold text-amber-800">Hay un presupuesto esperando tu aprobación.</p>
                    <p class="text-xs text-amber-700 mt-0.5"><a href="/" class="underline font-semibold">Ingresá al sistema</a> para verlo y aprobarlo o rechazarlo.</p>
                </div>` : '';
            $('resultado').innerHTML = `
                <div class="px-5 py-4 border-b">
                    <p class="font-mono text-sm text-gray-500">${esc(d.numero_rma)}</p>
                    <p class="text-lg font-bold">${esc(d.producto || 'Equipo')}</p>
                    <div class="mt-2 flex flex-wrap items-center gap-2">
                        <span class="px-3 py-1 rounded-full text-sm font-bold text-white" style="background:${esc(d.estado.color)}">${esc(d.estado.etiqueta)}</span>
                        <span class="px-2 py-0.5 rounded text-xs font-semibold ${d.en_garantia ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${d.en_garantia ? 'En garantía' : 'Fuera de garantía'}</span>
                    </div>
                    <p class="text-xs text-gray-400 mt-2">Ingresó el ${fecha(d.fecha_ingreso)} · última novedad ${fecha(d.ultima_actualizacion)}</p>
                </div>
                ${pres}
                <div class="px-5 py-4">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3">Historial</p>
                    <ol>${pasos}</ol>
                </div>
                ${envio}`;
            $('resultado').classList.remove('hidden');
            if (d.empresa) { $('marca').textContent = d.empresa; }
        }

        async function consultar(rma, serie) {
            $('error').classList.add('hidden');
            $('btn').disabled = true; $('btn').textContent = 'Consultando…';
            try {
                const r = await fetch(`/public/seguimiento?rma=${encodeURIComponent(rma)}&serie=${encodeURIComponent(serie)}`);
                const d = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(d.detail || 'No se pudo consultar. Probá de nuevo.');
                mostrar(d);
                history.replaceState(null, '', `?rma=${encodeURIComponent(rma)}&serie=${encodeURIComponent(serie)}`);
            } catch (e) {
                $('resultado').classList.add('hidden');
                $('error').textContent = e.message;
                $('error').classList.remove('hidden');
            } finally {
                $('btn').disabled = false; $('btn').textContent = 'Consultar';
            }
        }

        $('form').addEventListener('submit', e => {
            e.preventDefault();
            consultar($('rma').value.trim(), $('serie').value.trim());
        });

        // Link del QR: /seguimiento?rma=...&serie=... consulta directo
        const q = new URLSearchParams(location.search);
        if (q.get('rma') && q.get('serie')) {
            $('rma').value = q.get('rma'); $('serie').value = q.get('serie');
            consultar(q.get('rma'), q.get('serie'));
        }
    })();
    </script>
</body>
</html>
