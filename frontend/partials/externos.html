<section id="externos-section" class="max-w-7xl mx-auto">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-3">
            <button type="button" id="back-to-list" class="flex items-center text-blue-600 hover:text-blue-800 transition">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Volver
            </button>
            <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2 whitespace-nowrap"><i data-icono="camion" class="w-6 h-6 text-fuchsia-600"></i>Fuera del taller</h2>
        </div>
        <div id="externos-resumen" class="flex items-center gap-6"></div>
    </div>
    <p class="text-sm text-gray-500 mb-4">Equipos en la garantía del fabricante o en un servicio técnico oficial. Se mandan y se reciben desde el ticket.</p>

    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div class="flex flex-wrap items-center gap-2">
            <div class="inline-flex rounded-lg border bg-white overflow-hidden text-sm" role="group" aria-label="Estado">
                <button type="button" data-ext-estado="enviado" class="px-3 py-2">Afuera</button>
                <button type="button" data-ext-estado="recibido" class="px-3 py-2 border-l">Volvieron</button>
                <button type="button" data-ext-estado="todos" class="px-3 py-2 border-l">Todos</button>
            </div>
            <select id="externos-destino" class="border rounded-lg px-3 py-2 text-sm bg-white max-w-[14rem]" aria-label="Destino">
                <option value="">Todos los destinos</option>
            </select>
            <label id="externos-atrasados-wrap" class="inline-flex items-center gap-2 text-sm text-gray-700 bg-white border rounded-lg px-3 py-2 cursor-pointer">
                <input type="checkbox" id="externos-atrasados" class="accent-red-600"> Solo atrasados
            </label>
        </div>
        <div class="flex items-center gap-2 text-sm">
            <span class="text-gray-500">Exportar:</span>
            <button type="button" data-ext-exportar="xlsx" class="px-3 py-1.5 rounded-lg border bg-white hover:bg-gray-50">Excel</button>
            <button type="button" data-ext-exportar="csv" class="px-3 py-1.5 rounded-lg border bg-white hover:bg-gray-50">CSV</button>
        </div>
    </div>

    <div id="externos-cuerpo"><div class="text-center py-12 text-gray-400 text-sm">Cargando...</div></div>
</section>
