<section id="dashboard-section">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Panel de Control</h2>
            <p class="text-gray-500" id="role-badge"></p>
        </div>
        <div id="action-buttons" class="flex items-center gap-3">
            <button type="button" id="favorites-nav-btn"
                class="hidden items-center gap-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 px-4 py-2 rounded-lg font-semibold shadow transition">
                ⭐ Favoritos
            </button>
            <button type="button" id="admin-panel-btn"
                class="hidden items-center gap-2 bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-semibold shadow transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                Administración
            </button>
            <button type="button" id="mostrador-btn"
                class="hidden items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold shadow transition">
                🧾 Ingreso en mostrador
            </button>
            <button type="button" id="create-ticket-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold shadow transition">Nuevo Ticket</button>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8" id="stats-container"></div>

    <!-- Advanced Stats (Admin) -->
    <div id="advanced-stats" class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8 hidden">
        <div class="bg-white p-6 rounded-xl shadow border">
            <h3 class="font-bold text-gray-700 mb-4">Estado Tickets</h3>
            <div style="height:150px"><canvas id="chart-states"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow border">
            <h3 class="font-bold text-gray-700 mb-4">Fallas por Producto</h3>
            <div style="height:150px"><canvas id="chart-products"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow border">
            <h3 class="font-bold text-gray-700 mb-4">Carga por Técnico</h3>
            <div style="height:150px"><canvas id="chart-techs"></canvas></div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow border text-center flex flex-col justify-center">
            <h3 class="font-bold text-gray-700 mb-2 italic">SLA / Eficiencia</h3>
            <p class="text-5xl font-black text-blue-600" id="avg-repair-time">--</p>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-wide">Tiempo prom. reparación</p>
        </div>
    </div>

    <!-- Alertas del taller: SLA y stock (frontend/js/alertas.js) -->
    <div id="alertas-panel" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8"></div>

    <!-- Satisfacción de los clientes (solo taller; frontend/js/encuesta.js) -->
    <div id="satisfaccion-panel" class="hidden mb-8"></div>

    <!-- Lista / Tablero (solo taller; frontend/js/kanban.js) -->
    <div id="vista-selector" class="hidden items-center gap-1 bg-gray-200 rounded-lg p-1 w-fit mb-4">
        <button type="button" data-vista="lista" class="px-4 py-1.5 rounded-md text-sm font-semibold transition">☰ Lista</button>
        <button type="button" data-vista="tablero" class="px-4 py-1.5 rounded-md text-sm font-semibold transition">▦ Tablero</button>
    </div>

    <!-- Kanban -->
    <div id="kanban-wrap" class="hidden mb-6">
        <p class="text-xs text-gray-400 mb-2">Arrastrá una tarjeta a otra columna para cambiarle el estado. Click para abrir el ticket.</p>
        <div id="kanban-board" class="flex gap-3 overflow-x-auto pb-3"></div>
    </div>

    <!-- Filters -->
    <div id="ticket-filters" class="flex items-center space-x-4 mb-6">
        <label class="text-sm font-semibold text-gray-600">Filtrar por estado:</label>
        <select id="filter-status" class="px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">Todos</option>
            <option value="Nuevo">Nuevo</option>
            <option value="En revisión">En revisión</option>
            <option value="Aprobado para RMA">Aprobado para RMA</option>
            <option value="Equipo recibido">Equipo recibido</option>
            <option value="En diagnóstico">En diagnóstico</option>
            <option value="En reparación">En reparación</option>
            <option value="Esperando repuestos">Esperando repuestos</option>
            <option value="Reparado">Reparado</option>
            <option value="Enviado al cliente">Enviado al cliente</option>
            <option value="Cerrado">Cerrado</option>
        </select>
        <button type="button" id="apply-filters" class="bg-gray-800 text-white px-4 py-2 rounded-md text-sm hover:bg-gray-700 transition">Filtrar</button>
    </div>

    <!-- Ticket Table -->
    <div id="ticket-list-wrap" class="bg-white rounded-xl shadow overflow-hidden border border-gray-100">
        <table class="w-full text-left">
            <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Ticket / RMA</th>
                    <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Producto</th>
                    <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Estado</th>
                    <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Fecha</th>
                    <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider text-right">Acciones</th>
                </tr>
            </thead>
            <tbody id="ticket-list-body" class="divide-y"></tbody>
        </table>
    </div>
</section>
