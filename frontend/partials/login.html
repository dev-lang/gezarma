<section id="login-section" class="max-w-md mx-auto mt-6 sm:mt-14">
    <div class="text-center mb-6">
        <div id="login-marca-logo" class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md overflow-hidden">
            <i data-icono="llave" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900" data-marca-nombre translate="no">GEZARMA</h2>
        <p class="text-gray-500 mt-1 text-sm">Ingresá para ver y gestionar las reparaciones</p>
    </div>
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-200">

    <!-- Inline error banner (hidden by default) -->
    <div id="login-error" class="hidden mb-4 flex items-start gap-3 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
        <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        <span id="login-error-msg"></span>
    </div>

    <form id="login-form" class="space-y-4" novalidate>
        <div>
            <label for="login-username" class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
            <input type="text" id="login-username" autocomplete="username"
                class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                placeholder="Tu nombre de usuario">
            <p id="login-username-err" class="hidden text-red-500 text-xs mt-1">El usuario es obligatorio.</p>
        </div>
        <div>
            <label for="login-password" class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
            <div class="relative">
                <input type="password" id="login-password" autocomplete="current-password"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition pr-12"
                    placeholder="Tu contraseña">
                <button type="button" id="toggle-password"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
                    tabindex="-1" aria-label="Mostrar contraseña">
                    <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                </button>
            </div>
            <p id="login-password-err" class="hidden text-red-500 text-xs mt-1">La contraseña es obligatoria.</p>
        </div>
        <button type="submit" id="login-form-btn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-sm transition">
            Ingresar
        </button>
    </form>
    <p id="login-registro" class="mt-6 pt-5 border-t border-gray-100 text-center text-sm text-gray-600">
        ¿No tenés cuenta? <a href="#" id="to-register" class="text-blue-600 font-semibold hover:underline">Registrate</a>
    </p>
    </div>
    <div class="mt-5 flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-sm text-gray-500">
        <a href="/seguimiento" id="login-seguimiento" class="inline-flex items-center gap-1.5 hover:text-blue-600"><i data-icono="buscar" class="w-4 h-4"></i>¿Cómo va mi reparación?</a>
        <span data-idioma-selector="text-sm text-gray-500 bg-transparent border border-gray-200 rounded-lg px-2 py-1"></span>
    </div>
</section>
