<section id="register-section" class="max-w-md mx-auto mt-16 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-800">Registro</h2>
        <p class="text-gray-500 mt-2">Crea tu cuenta de cliente</p>
    </div>
    <form id="register-form" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-1">Nombre Completo</label>
            <input type="text" id="reg-nombre" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" required>
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Usuario</label>
            <input type="text" id="reg-username" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" required>
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Email</label>
            <input type="email" id="reg-email" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" required>
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Tipo de Cliente</label>
            <select id="reg-tipo" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                <option value="persona">Persona Particular</option>
                <option value="empresa">Empresa / Corporativo</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Contraseña</label>
            <input type="password" id="reg-password" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" required>
        </div>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition transform hover:-translate-y-0.5">Registrarse</button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
        ¿Ya tienes cuenta? <a href="#" id="to-login" class="text-blue-600 font-semibold hover:underline">Inicia sesión</a>
    </p>
</section>
