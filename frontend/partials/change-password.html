<section id="change-password-section" class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Cambiar Contraseña</h2>
            <p class="text-gray-500 text-sm mt-1">Tu cuenta requiere que establezcas una nueva contraseña antes de continuar.</p>
        </div>

        <div id="cp-error" class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nueva contraseña</label>
                <input type="password" id="cp-new-password"
                    class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="Mínimo 6 caracteres">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Confirmar contraseña</label>
                <input type="password" id="cp-confirm-password"
                    class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="Repetir nueva contraseña">
            </div>
        </div>

        <button type="button" id="cp-submit-btn"
            class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold shadow transition">
            Establecer nueva contraseña
        </button>
    </div>
</section>
