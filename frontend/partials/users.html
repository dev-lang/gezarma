<section id="users-section">
    <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <button type="button" id="back-to-dashboard-from-users" class="flex items-center text-blue-600 hover:text-blue-800 transition">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Volver
            </button>
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Gestión de Usuarios</h2>
                <p class="text-gray-500 text-sm">Roles, accesos y estado de cuenta</p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow border border-gray-100 overflow-hidden">
        <div class="p-4 bg-gray-50 border-b flex items-center justify-between">
            <p class="text-sm text-gray-500">Los nuevos usuarios se registran desde la pantalla de login.</p>
            <div class="flex items-center gap-3">
                <label class="text-xs font-semibold text-gray-500 uppercase">Filtrar:</label>
                <select id="user-filter-rol" class="text-sm border rounded-lg px-3 py-1.5 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Todos los roles</option>
                    <option value="cliente">Clientes</option>
                    <option value="tecnico">Técnicos</option>
                    <option value="administrador">Administradores</option>
                </select>
                <select id="user-filter-activo" class="text-sm border rounded-lg px-3 py-1.5 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Todos</option>
                    <option value="true">Habilitados</option>
                    <option value="false">Deshabilitados</option>
                </select>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="border-b text-xs uppercase text-gray-500 bg-gray-50">
                        <th class="px-6 py-3">Usuario</th>
                        <th class="px-6 py-3">Nombre</th>
                        <th class="px-6 py-3">Email</th>
                        <th class="px-6 py-3">Rol</th>
                        <th class="px-6 py-3 text-center">Estado</th>
                        <th class="px-6 py-3 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="user-list-body"></tbody>
            </table>
        </div>
    </div>
</section>
